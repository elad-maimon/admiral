name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Supabase and Vercel authentication tokens (Manage these strictly in GitHub Repository Settings -> Secrets)
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.Js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Restore node_modules cache
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: node_modules
          # Only bust node_modules lockfile changes. Not source code!
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # PHASE 1: Deploy Database Migrations and Config
      - name: Push Database Config & Migrations
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # We dynamically extract the Supabase Project ID directly from your .env.production to strictly respect DRY!
          EXTRACTED_PROJECT_ID=$(grep NEXT_PUBLIC_SUPABASE_URL .env.production | cut -d'/' -f3 | cut -d'.' -f1)
          echo "Detected Supabase Project ID: $EXTRACTED_PROJECT_ID"
          
          # Link and Push using the secure Auth Secrets
          supabase link --project-ref $EXTRACTED_PROJECT_ID --password $SUPABASE_DB_PASSWORD
          supabase db push --password $SUPABASE_DB_PASSWORD
          supabase config push

      # PHASE 2: Deploy Frontend Code
      - name: Pull Vercel Environment Information
        # Vercel natively reads your committed `.vercel/project.json` to know exactly which app to deploy!
        run: npx --yes vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts
        run: npx --yes vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel
        run: npx --yes vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
